name: Verify build

# Guards the src/ -> index.html contract: index.html is generated by
# tools/build-game.mjs, so any push where it doesn't match src/ (hand-edited
# index.html, or a src/ change committed without rebuilding) fails here.
#
# The smoke job then boots the built page in a real browser. --check only proves
# the file is in sync; it cannot see a game that renders a blank canvas, hides
# the element a tutorial step points at, or silently depends on a CDN.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: index.html matches src/
        run: node tools/build-game.mjs --check

      # The source once had a 26,919-character line, which makes a one-character
      # edit indistinguishable from a rewrite in a diff. Hold the line at a level
      # that cannot regress to that; run `node tools/fmt.mjs` to fix.
      - name: no monster source lines
        run: node tools/fmt.mjs --check --limit 2000

      - name: game script parses
        run: |
          node -e "
            const fs=require('fs'),path=require('path');
            const dir='src/game';
            const parts=fs.readdirSync(dir).filter(f=>f.endsWith('.js')).sort();
            const code=parts.map(f=>fs.readFileSync(path.join(dir,f),'utf8').replace(/\n\$/,'')).join('\n');
            fs.writeFileSync('/tmp/game-concat.js','class DCLogic{}\n'+code);
          "
          node --check /tmp/game-concat.js

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: install playwright chromium
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: boot the game and play a flick
        run: node tools/smoke.mjs --shots artifacts

      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: artifacts/
          if-no-files-found: ignore
